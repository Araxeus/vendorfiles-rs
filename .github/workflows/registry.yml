name: Registry

# Only when the registry itself changes: the check queries GitHub for every entry's latest
# release, which is neither free nor deterministic enough to gate every pull request.
on:
  pull_request:
    paths: &registry
      - registry.yml
      - registry.schema.json
      - crates/vendorfiles_core/src/registry/**
      - .github/workflows/registry.yml
  push:
    branches: [main]
    paths: *registry
  # A release renaming its assets breaks an entry without anyone touching this repository.
  schedule:
    # Runs at 06:00, only on Monday
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  entries-resolve:
    name: Entries name assets and members that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Ignored tests hit live GitHub releases; the rest check the schema offline.
      - name: Verify the schema and live releases

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          cargo test -p vendorfiles_core --lib registry -- --include-ignored --nocapture
