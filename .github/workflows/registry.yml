name: Registry

# Only when the registry itself changes: the check queries GitHub for every entry's latest
# release, which is neither free nor deterministic enough to gate every pull request.
on:
  pull_request:
    paths: &registry
      - registry.yml
      - registry.schema.json
      - crates/vendorfiles_core/src/registry/**
      - .github/workflows/registry.yml
  push:
    branches: [main]
    paths: *registry
  # A release renaming its assets breaks an entry without anyone touching this repository.
  schedule:
    # Runs at 06:00, only on Monday
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  entries-resolve:
    name: Entries name assets and members that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The offline tests parse `registry.yml` and validate it against `registry.schema.json`.
      # The ignored tests resolve every entry for every host it claims, then check the asset it
      # names is in the release GitHub actually publishes. They also download one asset per entry -
      # this runner's own platform where the entry covers it - and check the `member` really is
      # inside it. Reading inside every asset for every platform would be gigabytes, so one
      # platform per entry it is.
      - name: Verify the schema and live releases

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          cargo test -p vendorfiles_core --lib registry -- --include-ignored --nocapture
