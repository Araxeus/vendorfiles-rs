name: README

# The README's examples and program list are generated. Code changes run this check in the
# Check workflow; this one covers edits to the README or the registry alone.
on:
  push:
    branches: [main]
    paths: &sources
      - README.md
      - registry.yml
      - .github/workflows/readme.yml
  pull_request:
    paths: *sources

env:
  CARGO_TERM_COLOR: always

jobs:
  readme:
    name: README is generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: README examples
        run: cargo run -p xtask -- readme --check
