name: Check

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # One leg per platform: `github::credentials` compiles a different native store on each, and
  # a store's `new` plus its read/write round trip is only exercised by the tests that run
  # there. A Linux-only job would leave the macOS and Windows branches unbuilt until a release.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

  # The Linux release binary is statically linked against musl so it runs on distributions
  # older than the runner's glibc (see release.yml). Nothing else builds that target, so
  # without this leg a break in it - a C dependency that will not cross-compile, a link error -
  # would first surface during a release.
  musl:
    name: Static Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --package vendorfiles --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Check the binary is static
        run: |
          binary=target/x86_64-unknown-linux-musl/release/vendor
          file "$binary"
          if readelf --dynamic "$binary" | grep -q NEEDED; then
            echo "::error::$binary links a shared library, so it carries a glibc floor"
            readelf --dynamic "$binary" | grep NEEDED
            exit 1
          fi

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt check
        run: cargo fmt --all --check

      # The README's YAML and TOML examples are generated from the JSON beside them; this fails
      # when they no longer match it.
      - name: README examples
        run: cargo run -p xtask -- readme --check

      - name: Clippy
        run: >
          cargo clippy --all-targets --all-features
          -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery -D warnings

  clippy-sarif:
    name: Upload clippy results
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install clippy-sarif
        run: cargo install clippy-sarif sarif-fmt

      - name: Clippy (SARIF)
        run: >
          cargo clippy --all-targets --all-features --message-format=json
          -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery
          | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
