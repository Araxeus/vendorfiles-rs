name: Check

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # One leg per platform: `github::credentials` compiles a different native store on each, and
  # a store's `new` plus its read/write round trip is only exercised by the tests that run
  # there. A Linux-only job would leave the macOS and Windows branches unbuilt until a release.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Clippy
        run: >
          cargo clippy --all-targets --all-features
          -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery -D warnings

  clippy-sarif:
    name: Upload clippy results
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install clippy-sarif
        run: cargo install clippy-sarif sarif-fmt

      - name: Clippy (SARIF)
        run: >
          cargo clippy --all-targets --all-features --message-format=json
          -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery
          | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
