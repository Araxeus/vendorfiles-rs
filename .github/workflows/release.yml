name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build:
    name: build ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            target: aarch64-apple-darwin
            extension: tar.gz
          # Statically linked against musl rather than the runner's glibc. A gnu build on
          # ubuntu-latest records the runner's glibc as a minimum - `GLIBC_2.39` as of 24.04 -
          # and refuses to start on anything older, which is most long-lived server
          # distributions (Rocky 9 ships 2.34). A static binary has no such floor.
          - os: ubuntu-latest
            name: linux
            target: x86_64-unknown-linux-musl
            extension: tar.gz
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc
            extension: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # `zstd-sys` and `ring` compile C, so the target needs its own C compiler. Without one
      # cc-rs may fall back to the host `gcc` and link glibc objects into a supposedly static
      # binary; `CC_x86_64_unknown_linux_musl` below makes the choice explicit.
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --package vendorfiles --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      # The failure this guards against is silent: a dynamically linked binary is built, tarred
      # and published exactly like a static one, and only fails on the user's machine.
      - name: Check the Linux binary is static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          binary=target/${{ matrix.target }}/release/vendor
          file "$binary"
          if readelf --dynamic "$binary" | grep -q NEEDED; then
            echo "::error::$binary links a shared library, so it carries a glibc floor"
            readelf --dynamic "$binary" | grep NEEDED
            exit 1
          fi

      - name: Get filename
        id: filename
        shell: sh
        run: echo "FILENAME=vendor_${GITHUB_REF#refs/tags/}_${{ matrix.name }}.${{ matrix.extension }}" >> "$GITHUB_OUTPUT"

      - name: Tar (Unix)
        if: matrix.os != 'windows-latest'
        run: tar czf ${{ steps.filename.outputs.FILENAME }} -C target/${{ matrix.target }}/release vendor

      - name: Zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/vendor.exe ${{ steps.filename.outputs.FILENAME }} -Force

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.filename.outputs.FILENAME }}
          if-no-files-found: error

  # Releases are immutable once published, so assets go into a draft that is published by hand

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
