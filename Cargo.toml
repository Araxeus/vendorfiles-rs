[workspace]
members = ["crates/vendorfiles", "crates/vendor-cli", "xtask"]
resolver = "2"

[workspace.package]
version = "1.4.2"
authors = ["Araxeus"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Araxeus/vendorfiles"
homepage = "https://github.com/Araxeus/vendorfiles"
documentation = "https://github.com/Araxeus/vendorfiles#readme"
readme = "README.md"
keywords = ["vendor", "package-manager", "github", "cli", "files"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
vendorfiles = { path = "crates/vendorfiles", version = "1.4.2" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "string"] }
dialoguer = { version = "0.11", default-features = false }
fancy-regex = "0.14"
flate2 = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2.7", features = ["serde"] }
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    # Blocking Secret Service backend: no nested async runtime, and `crypto-rust` encrypts
    # the secret in transit over the bus without pulling in OpenSSL.
    "sync-secret-service",
    "crypto-rust",
] }
octocrab = { version = "0.44", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-ring",
    "timeout",
] }
open = "5.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "json",
] }
secrecy = "0.10"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tar = "0.4"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "time",
    "sync",
] }
toml_edit = { version = "0.22", features = ["serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
