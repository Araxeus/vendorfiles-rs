[workspace]
members = ["crates/vendorfiles", "crates/vendorfiles_core", "xtask"]
resolver = "2"

[workspace.package]
version = "2.4.0"
authors = ["Araxeus"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Araxeus/vendorfiles-rs"
documentation = "https://araxeus.github.io/vendorfiles-rs/"
readme = "README.md"
keywords = ["vendor", "package-manager", "github", "cli", "files"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
vendorfiles_core = { path = "crates/vendorfiles_core", version = "2.4.0" }

anyhow = "1.0.105"
# `vendor login` copies the one-time code. Text only: `image-data` would pull in the `image` crate.
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6.10", features = ["derive", "string"] }
clap_complete = "4.6.12"
dialoguer = { version = "0.12.0", default-features = false }
fancy-regex = "0.20.2"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = { version = "0.4.22", default-features = false }
indexmap = { version = "2.14.2", features = ["serde"] }
# Reads and edits JSON configs, which are parsed as JSON5. The `cst` feature keeps comments and
# layout as ordinary nodes, so a version bump rewrites one string and leaves the rest of the file
# alone. `xtask readme` uses the same tree to carry `//` notes into the generated YAML and TOML.
# `serde` and `serde_json` give the text back as a `serde_json::Value` for typed reads.
jsonc-parser = { version = "0.34.0", default-features = false, features = [
    "cst",
    "serde",
    "serde_json",
] }
# Validates `registry.schema.json` in the tests, so a broken `$ref` or a regression in the
# `path`-versus-`targets` rule fails the suite rather than only editor completion. Default features
# off: they resolve remote `$ref`s over HTTPS and pull aws-lc-rs in to do it, and this schema
# refers to nothing outside itself.
jsonschema = { version = "0.63.2", default-features = false }
# Credential storage is `keyring-core` plus exactly one native store per platform, pulled in
# through `[target.'cfg(target_os = "…")'.dependencies]` in `crates/vendorfiles_core`. Depending on
# the `keyring` facade instead would compile every backend's support code on every target and,
# on Linux, link libdbus for a Secret Service backend we do not use.
keyring-core = "1.1.0"
# `keychain` selects the macOS login keychain; the iOS-only `protected` store stays out.
apple-native-keyring-store = { version = "1.0.3", default-features = false, features = [
    "keychain",
] }
# Preferred on Linux: the Secret Service persists to disk, so a token survives a reboot. The
# `zbus` implementation rather than the `dbus` one keeps this pure Rust - no libdbus to link.
# `rt-async-io-crypto-rust` drives zbus's blocking API on its own async-io executor, so it never
# interacts with the tool's tokio runtime, and encrypts the bus session without OpenSSL.
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = [
    "rt-async-io-crypto-rust",
] }
# The fallback when no Secret Service is running (headless boxes, minimal containers, WSL).
linux-keyutils-keyring-store = "1.0.0"
# `.tar.xz` releases. Pure Rust, like every other codec here - `xz2`/`liblzma` would bind the C
# library and put a build toolchain between a user and `cargo install`. Its `xz` feature verifies
# every check type xz defines, SHA-256 included, which `upx` ships. The encoder is for tests only.
lzma-rust2 = { version = "0.26.0", default-features = false, features = ["std", "xz"] }
# `.7z` archives, built on `lzma-rust2` above. The defaults are off: `aes256` opens encrypted
# archives, which need a password nothing here has, and `compress` is the encoder, for tests only.
# `bzip2` and `zstd` reuse the crates `zip` already pulls in, and `ppmd` is small and pure Rust.
sevenz-rust2 = { version = "0.27.0", default-features = false, features = [
    "bzip2",
    "ppmd",
    "zstd",
] }
# Installers on Windows: the Apps & Features (uninstall) keys are read through the safe registry
# API, and `windows-sys` provides `ShellExecuteExW`, which raises the UAC prompt for an installer
# that needs admin and hands back a process handle to wait on. Both are already in the tree.
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `search` (the default) would add a `regex` dependency for enumerating credentials, which
# nothing here does.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
octocrab = { version = "0.54.9", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-ring",
    # Required even though no GitHub App JWT is ever signed here; the pure-Rust backend keeps
    # aws-lc-rs out of the tree.
    "jwt-rust-crypto",
    "timeout",
] }
open = "5.4.5"
# The live display. Default features off: only the crossterm backend is wanted, and the inline
# viewport is the whole reason for the dependency - a fixed region we redraw from a state
# snapshot, rather than cursor arithmetic of our own.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.2"
# `rustls-no-provider` rather than `rustls`: the latter hard-wires the aws-lc-rs provider,
# which would compile a second crypto backend alongside the `ring` one octocrab uses (and drag
# in aws-lc-sys's C build). `github::http` installs `ring` as the process default instead.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "system-proxy",
    "gzip",
    "stream",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# Reads a version out of an HTML page with a CSS selector (`versionSelector`). It parses like a
# browser, so a selector picks what `document.querySelector` would. Default features off: they
# build a CLI.
scraper = { version = "0.29.0", default-features = false }
secrecy = "0.10.3"
# Swapping a running binary is platform work: on Windows the file is locked, so the old image has
# to be moved aside and deleted after exit. `vendor` uses it when an install lands on top of
# itself.
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "time",
    "sync",
    # Ctrl-C has to give the terminal back: nothing else runs when the process is signalled.
    "signal",
] }
toml_edit = { version = "0.25.17", features = ["serde"] }
# Edits YAML configs in place, keeping comments, quoting and layout. Default features off: `binary`
# decodes `!!binary` scalars through base64, which no config holds.
yaml-edit = { version = "0.3.6", default-features = false }
zip = { version = "9.9.0", default-features = false, features = ["deflate", "bzip2", "zstd"] }

# The lint set CI enforces, declared here so a bare `cargo clippy` is the same gate as the
# workflow. `priority = -1` keeps these groups below any individual lint, so a specific
# `allow`/`expect` still wins over the group that raised it.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
