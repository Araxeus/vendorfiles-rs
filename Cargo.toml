[workspace]
members = ["crates/vendorfiles", "crates/vendorfiles_core", "xtask"]
resolver = "2"

[workspace.package]
version = "2.0.4"
authors = ["Araxeus"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Araxeus/vendorfiles-rs"
homepage = "https://github.com/Araxeus/vendorfiles-rs"
documentation = "https://github.com/Araxeus/vendorfiles-rs#readme"
readme = "README.md"
keywords = ["vendor", "package-manager", "github", "cli", "files"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
vendorfiles_core = { path = "crates/vendorfiles_core", version = "2.0.4" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "string"] }
clap_complete = "4.6.9"
dialoguer = { version = "0.12.0", default-features = false }
fancy-regex = "0.19.0"
flate2 = "1.1.9"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
indexmap = { version = "2.14.0", features = ["serde"] }
# Reads the README's config examples for `cargo xtask readme`. The `cst` feature is the reason
# for the crate: it keeps comments as ordinary sibling nodes, so a `//` note on an example
# survives into the generated YAML and TOML instead of being dropped on the way through a value
# tree. `serde` gives the same text back as a `serde_json::Value` for the round-trip check.
jsonc-parser = { version = "0.33", default-features = false, features = ["cst", "serde"] }
# Validates `registry.schema.json` in the tests, so a broken `$ref` or a regression in the
# `path`-versus-`targets` rule fails the suite rather than only editor completion. Default features
# off: they resolve remote `$ref`s over HTTPS and pull aws-lc-rs in to do it, and this schema
# refers to nothing outside itself.
jsonschema = { version = "0.50.0", default-features = false }
# Credential storage is `keyring-core` plus exactly one native store per platform, pulled in
# through `[target.'cfg(target_os = "…")'.dependencies]` in `crates/vendorfiles_core`. Depending on
# the `keyring` facade instead would compile every backend's support code on every target and,
# on Linux, link libdbus for a Secret Service backend we do not use.
keyring-core = "1.0.0"
# `keychain` selects the macOS login keychain; the iOS-only `protected` store stays out.
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = [
    "keychain",
] }
# Preferred on Linux: the Secret Service persists to disk, so a token survives a reboot. The
# `zbus` implementation rather than the `dbus` one keeps this pure Rust — no libdbus to link.
# `rt-async-io-crypto-rust` drives zbus's blocking API on its own async-io executor, so it never
# interacts with the tool's tokio runtime, and encrypts the bus session without OpenSSL.
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = [
    "rt-async-io-crypto-rust",
] }
# The fallback when no Secret Service is running (headless boxes, minimal containers, WSL).
linux-keyutils-keyring-store = "1.0.0"
# `.tar.xz` releases. Pure Rust, like every other codec here — `xz2`/`liblzma` would bind the C
# library and put a build toolchain between a user and `cargo install`.
lzma-rs = "0.3.0"
# `search` (the default) would add a `regex` dependency for enumerating credentials, which
# nothing here does.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
octocrab = { version = "0.54.1", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-ring",
    # Required even though no GitHub App JWT is ever signed here; the pure-Rust backend keeps
    # aws-lc-rs out of the tree.
    "jwt-rust-crypto",
    "timeout",
] }
open = "5.4.1"
# The live display. Default features off: only the crossterm backend is wanted, and the inline
# viewport is the whole reason for the dependency — a fixed region we redraw from a state
# snapshot, rather than cursor arithmetic of our own.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
# `rustls-no-provider` rather than `rustls`: the latter hard-wires the aws-lc-rs provider,
# which would compile a second crypto backend alongside the `ring` one octocrab uses (and drag
# in aws-lc-sys's C build). `github::http` installs `ring` as the process default instead.
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "system-proxy",
    "gzip",
    "stream",
] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
secrecy = "0.10.3"
# Swapping a running binary is platform work: on Windows the file is locked, so the old image has
# to be moved aside and deleted after exit. `vendor` uses it when an install lands on top of
# itself.
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "time",
    "sync",
    # Ctrl-C has to give the terminal back: nothing else runs when the process is signalled.
    "signal",
] }
toml_edit = { version = "0.25.13", features = ["serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "bzip2", "zstd"] }

# The lint set CI enforces, declared here so a bare `cargo clippy` is the same gate as the
# workflow. `priority = -1` keeps these groups below any individual lint, so a specific
# `allow`/`expect` still wins over the group that raised it.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
