[package]
name = "vendorfiles_core"
description = "Library powering the vendorfiles CLI: pull files from GitHub repositories and keep them up to date"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fancy-regex.workspace = true
flate2.workspace = true
futures-util.workspace = true
indexmap.workspace = true
keyring-core.workspace = true
lzma-rs.workspace = true
octocrab.workspace = true
open.workspace = true
ratatui.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
self-replace.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml_edit.workspace = true
zip.workspace = true

# One native credential store per platform. `keyring_core::set_default_store` is told which one
# to use in `github::auth`; on any other target the keyring is simply unavailable and token
# resolution falls back to `GITHUB_TOKEN`.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true
linux-keyutils-keyring-store.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
