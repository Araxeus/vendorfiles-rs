# yaml-language-server: $schema=./registry.schema.json
#
# Programs `vendor add <name>` can install without being told a repository or its asset names.
#
# To add one, open a pull request against this file. Every pull request proves the file parses and
# that each entry resolves for every host it lists. A change to this file also queries GitHub: the
# asset each entry names must exist for every host, and the `member` inside it is checked for real
# on one platform - the runner's own where the entry covers it. So a wrong `member` is caught, and
# the failure lists what the archive actually holds.
#
# Test your entry before opening the PR:
#
#     VENDOR_REGISTRY=./registry.yml vendor add <name>
#
# Every entry needs a `description`: one short line on what the program does. `vendor search`
# matches it, so use the words someone would search for ("disk usage", "git", "editor").
#
# Then refresh the README's list of programs, which CI checks is current:
#
#     cargo xtask readme
#
# Placeholders
#   {release}  marks a release asset (config syntax, left as-is in the entry that gets written)
#   {version}  the semver core of the tag: `v10.4.2` and `10.4.2` both give `10.4.2`
#   {target}   the triple this host maps to under `targets`
#   {ext}      `.zip` on Windows, `.tar.gz` elsewhere
#   {exe}      `.exe` on Windows, empty elsewhere
#
# Host keys are `{os}-{arch}` exactly as Rust reports them: windows-x86_64, macos-aarch64,
# linux-x86_64, linux-aarch64, and so on. List only the hosts upstream actually publishes.
#
# `member` is the path inside the asset. Leave it out when the asset *is* the executable, and add
# `as` when its name is not the command you would type (`ox-macos` -> `ox`). An asset that names a
# member must be a container the extractor reads: zip, tar, gz, tar.gz/tgz, tar.xz, crx or xpi.
#
# A `member` may also name more than one file, for a program whose executable cannot run alone.
# The forms name their outputs differently, because they mean different things. One member is the
# executable, so it lands under its basename - `fd-v10.3.0-x86_64-pc-windows-msvc/fd.exe` becomes
# `fd.exe` - and `as` may rename it. A *list* is a layout, so every path is written out as it
# stands, directories included. A *map* is that layout with each destination spelled out, which is
# how `x64/programz.exe` arrives as `program.exe`. Naming more than one file leaves `as` nothing
# single to rename, so it is refused beside either.
#
# A host may name *several assets* instead of one, as a list of `asset`/`member` blocks, for a
# release that splits what one host needs across an archive and a loose file beside it.
#
# `releaseRegex` narrows which tags count, for repositories that publish several trains of
# releases. `path` vendors a file from the repository instead of a release, with `hashVersionFile`
# to track it by commit; it takes no `targets`, being the same everywhere.
#
# An entry says *what* to download. It cannot say where files land - there is no `vendorFolder`
# here, and unknown keys are refused.

version: 2

programs:
  # Most Rust projects name assets by target triple and ship the binary inside a directory of
  # the same name, which the compact form covers in a few lines.
  fd:
    description: "Fast, user-friendly alternative to find for locating files and folders"
    aliases: [fdfind, fd-find]
    repository: https://github.com/sharkdp/fd
    asset: "{release}/fd-v{version}-{target}{ext}"
    member: "fd-v{version}-{target}/fd{exe}"
    # No macos-x86_64: upstream builds only aarch64 for macOS.
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  # ripgrep tags releases without a leading `v`, so the asset carries {version} bare.
  ripgrep:
    description: "Fast recursive regex search of file contents, like grep"
    aliases: [rg]
    repository: https://github.com/BurntSushi/ripgrep
    asset: "{release}/ripgrep-{version}-{target}{ext}"
    member: "ripgrep-{version}-{target}/rg{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      # musl, not gnu: upstream publishes no gnu build for x86_64.
      linux-x86_64: x86_64-unknown-linux-musl
      linux-aarch64: aarch64-unknown-linux-gnu

  bat:
    description: "cat clone and file viewer with syntax highlighting and a pager"
    repository: https://github.com/sharkdp/bat
    asset: "{release}/bat-v{version}-{target}{ext}"
    member: "bat-v{version}-{target}/bat{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  hyperfine:
    description: "Command-line benchmarking tool that times and compares commands"
    repository: https://github.com/sharkdp/hyperfine
    asset: "{release}/hyperfine-v{version}-{target}{ext}"
    member: "hyperfine-v{version}-{target}/hyperfine{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  dust:
    description: "Disk usage viewer showing what takes up space, a more intuitive du"
    repository: https://github.com/bootandy/dust
    asset: "{release}/dust-v{version}-{target}{ext}"
    member: "dust-v{version}-{target}/dust{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  # The binary is `btm`. Tags carry no leading `v`.
  bottom:
    description: "System monitor for processes, CPU, memory, disks and network, like htop"
    aliases: [btm]
    repository: https://github.com/ClementTsang/bottom
    asset: "{release}/bottom_{target}{ext}"
    member: "btm{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  # Linux only, built against musl. Themes ship in the archive, but btop has a built-in default.
  btop:
    description: "Resource monitor for CPU, memory, disks, network and processes like htop"
    repository: https://github.com/aristocratos/btop
    asset: "{release}/btop-{target}.tar.gz"
    member: "btop/bin/btop"
    targets:
      linux-x86_64: x86_64-unknown-linux-musl
      linux-aarch64: aarch64-unknown-linux-musl

  # One zip holds every platform, each in a directory named by its triple. Windows is gnu only,
  # and there is no windows-aarch64 build.
  dysk:
    description: "Lists mounted disks and filesystems with free space, a friendlier df"
    repository: https://github.com/Canop/dysk
    asset: "{release}/dysk_{version}.zip"
    member: "{target}/dysk{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-gnu
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  # delta tags without a leading `v`. No macos-x86_64 or windows-aarch64 builds upstream.
  delta:
    description: "Syntax-highlighting pager and diff viewer for git, diff, grep and blame"
    aliases: [git-delta]
    repository: https://github.com/dandavison/delta
    asset: "{release}/delta-{version}-{target}{ext}"
    member: "delta-{version}-{target}/delta{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  # Zips on every platform, Unix included, with the binary at the archive root.
  ov:
    description: "Feature-rich terminal pager and text viewer, a modern take on less"
    repository: https://github.com/noborus/ov
    asset: "{release}/ov_{version}_{target}.zip"
    member: "ov{exe}"
    targets:
      windows-x86_64: windows_amd64
      windows-aarch64: windows_arm64
      macos-x86_64: darwin_amd64
      macos-aarch64: darwin_arm64
      linux-x86_64: linux_amd64
      linux-aarch64: linux_arm64

  # just and zoxide put the binary at the archive root and build Linux only against musl.
  just:
    description: "Command runner for project tasks and scripts, like make without builds"
    repository: https://github.com/casey/just
    asset: "{release}/just-{version}-{target}{ext}"
    member: "just{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-musl
      linux-aarch64: aarch64-unknown-linux-musl

  zoxide:
    description: "Smarter cd that jumps to the directories you use most"
    repository: https://github.com/ajeetdsouza/zoxide
    asset: "{release}/zoxide-{version}-{target}{ext}"
    member: "zoxide{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-musl
      linux-aarch64: aarch64-unknown-linux-musl

  # Asset names carry no version. Linux is musl because upstream builds aarch64 only that way.
  starship:
    description: "Fast, customizable prompt for any shell: bash, zsh, fish, PowerShell"
    repository: https://github.com/starship/starship
    asset: "{release}/starship-{target}{ext}"
    member: "starship{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-musl
      linux-aarch64: aarch64-unknown-linux-musl

  # fzf names assets `os_arch` rather than by triple, and puts the binary at the archive root,
  # so each host is spelled out.
  fzf:
    description: "Interactive command-line fuzzy finder for files, history and any list"
    repository: https://github.com/junegunn/fzf
    targets:
      windows-x86_64:
        asset: "{release}/fzf-{version}-windows_amd64.zip"
        member: "fzf.exe"
      windows-aarch64:
        asset: "{release}/fzf-{version}-windows_arm64.zip"
        member: "fzf.exe"
      macos-x86_64:
        asset: "{release}/fzf-{version}-darwin_amd64.tar.gz"
        member: "fzf"
      macos-aarch64:
        asset: "{release}/fzf-{version}-darwin_arm64.tar.gz"
        member: "fzf"
      linux-x86_64:
        asset: "{release}/fzf-{version}-linux_amd64.tar.gz"
        member: "fzf"
      linux-aarch64:
        asset: "{release}/fzf-{version}-linux_arm64.tar.gz"
        member: "fzf"

  yamlfmt:
    description: "YAML file formatter"
    repository: https://github.com/google/yamlfmt
    # Ships .tar.gz on every platform, Windows included, so the extension is literal.
    asset: "{release}/yamlfmt_{version}_{target}.tar.gz"
    member: "yamlfmt{exe}"
    targets:
      windows-x86_64: Windows_x86_64
      windows-aarch64: Windows_arm64
      macos-x86_64: Darwin_x86_64
      macos-aarch64: Darwin_arm64
      linux-x86_64: Linux_x86_64
      linux-aarch64: Linux_arm64

  micro:
    description: "Terminal text editor with familiar keys and mouse support, a modern nano"
    repository: https://github.com/zyedidia/micro
    asset: "{release}/micro-{version}-{target}{ext}"
    member: "micro-{version}/micro{exe}"
    targets:
      windows-x86_64: win64
      windows-aarch64: win-arm64
      macos-x86_64: osx
      macos-aarch64: macos-arm64
      linux-x86_64: linux64
      linux-aarch64: linux-arm64

  surge:
    description: "Fast file download manager with a terminal UI"
    repository: https://github.com/surge-downloader/surge
    asset: "{release}/Surge_{version}_{target}{ext}"
    member: "surge{exe}"
    targets:
      windows-x86_64: windows_amd64
      windows-aarch64: windows_arm64
      macos-x86_64: darwin_amd64
      macos-aarch64: darwin_arm64
      linux-x86_64: linux_amd64
      linux-aarch64: linux_arm64

  lazygit:
    description: "Terminal UI for git that handles staging, commits, branches and rebases"
    repository: https://github.com/jesseduffield/lazygit
    asset: "{release}/lazygit_{version}_{target}{ext}"
    member: "lazygit{exe}"
    targets:
      windows-x86_64: windows_x86_64
      windows-aarch64: windows_arm64
      macos-x86_64: darwin_x86_64
      macos-aarch64: darwin_arm64
      linux-x86_64: linux_x86_64
      linux-aarch64: linux_arm64

  # Zips on every platform, so the extension is literal.
  rclone:
    description: "rsync-style sync to cloud storage like S3, Google Drive and Dropbox"
    repository: https://github.com/rclone/rclone
    asset: "{release}/rclone-v{version}-{target}.zip"
    member: "rclone-v{version}-{target}/rclone{exe}"
    targets:
      windows-x86_64: windows-amd64
      windows-aarch64: windows-arm64
      macos-x86_64: osx-amd64
      macos-aarch64: osx-arm64
      linux-x86_64: linux-amd64
      linux-aarch64: linux-arm64

  ansi2txt:
    description: "Strips ANSI color and escape codes from text, leaving plain text"
    aliases: [ansi2text]
    repository: https://github.com/gabe565/ansi2txt
    asset: "{release}/ansi2txt_{version}_{target}{ext}"
    member: "ansi2txt{exe}"
    targets:
      windows-x86_64: windows_amd64
      windows-aarch64: windows_arm64
      macos-x86_64: darwin_amd64
      macos-aarch64: darwin_arm64
      linux-x86_64: linux_amd64
      linux-aarch64: linux_arm64

  # No windows-aarch64: upstream builds only i386 and x86_64 for Windows.
  sshm:
    description: "Terminal UI for managing and connecting to SSH hosts"
    repository: https://github.com/Gu1llaum-3/sshm
    asset: "{release}/sshm_{target}{ext}"
    member: "sshm{exe}"
    targets:
      windows-x86_64: Windows_x86_64
      macos-x86_64: Darwin_x86_64
      macos-aarch64: Darwin_arm64
      linux-x86_64: Linux_x86_64
      linux-aarch64: Linux_arm64

  ls-interactive:
    description: "Interactive ls for browsing files and navigating directories"
    aliases: [lsi]
    repository: https://github.com/Araxeus/ls-interactive
    asset: "{release}/lsi_v{version}_{target}{ext}"
    member: "ls-interactive{exe}"
    # One universal binary covers both Macs.
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: universal-apple-darwin
      macos-aarch64: universal-apple-darwin
      linux-x86_64: x86_64-unknown-linux-musl
      linux-aarch64: aarch64-unknown-linux-musl

  # `edit` nests its binary inside a directory on Windows but not on Unix, so each host is
  # spelled out rather than sharing one `member`.
  edit:
    description: "Microsoft's small terminal text editor, a modern MS-DOS Edit"
    aliases: [msedit]
    repository: https://github.com/microsoft/edit
    targets:
      windows-x86_64:
        asset: "{release}/edit-{version}-x86_64-windows.zip"
        member: "edit-{version}-x86_64-windows/edit.exe"
      windows-aarch64:
        asset: "{release}/edit-{version}-aarch64-windows.zip"
        member: "edit-{version}-aarch64-windows/edit.exe"
      macos-aarch64:
        asset: "{release}/edit-{version}-aarch64-apple-darwin.tar.gz"
        member: "edit"
      linux-x86_64:
        asset: "{release}/edit-{version}-x86_64-linux-gnu.tar.gz"
        member: "edit"
      linux-aarch64:
        asset: "{release}/edit-{version}-aarch64-linux-gnu.tar.gz"
        member: "edit"

  # ruff and atuin put the binary at the root on Windows but in a `{target}/` directory on Unix,
  # so each host is spelled out. Their asset names carry no version.
  ruff:
    description: "Fast Python linter and code formatter"
    repository: https://github.com/astral-sh/ruff
    targets:
      windows-x86_64:
        asset: "{release}/ruff-x86_64-pc-windows-msvc.zip"
        member: "ruff.exe"
      windows-aarch64:
        asset: "{release}/ruff-aarch64-pc-windows-msvc.zip"
        member: "ruff.exe"
      macos-x86_64:
        asset: "{release}/ruff-x86_64-apple-darwin.tar.gz"
        member: "ruff-x86_64-apple-darwin/ruff"
      macos-aarch64:
        asset: "{release}/ruff-aarch64-apple-darwin.tar.gz"
        member: "ruff-aarch64-apple-darwin/ruff"
      linux-x86_64:
        asset: "{release}/ruff-x86_64-unknown-linux-gnu.tar.gz"
        member: "ruff-x86_64-unknown-linux-gnu/ruff"
      linux-aarch64:
        asset: "{release}/ruff-aarch64-unknown-linux-gnu.tar.gz"
        member: "ruff-aarch64-unknown-linux-gnu/ruff"

  # No windows-aarch64: upstream builds Windows only for x86_64.
  atuin:
    description: "Searchable shell and command history, synced across machines"
    repository: https://github.com/atuinsh/atuin
    targets:
      windows-x86_64:
        asset: "{release}/atuin-x86_64-pc-windows-msvc.zip"
        member: "atuin.exe"
      macos-x86_64:
        asset: "{release}/atuin-x86_64-apple-darwin.tar.gz"
        member: "atuin-x86_64-apple-darwin/atuin"
      macos-aarch64:
        asset: "{release}/atuin-aarch64-apple-darwin.tar.gz"
        member: "atuin-aarch64-apple-darwin/atuin"
      linux-x86_64:
        asset: "{release}/atuin-x86_64-unknown-linux-gnu.tar.gz"
        member: "atuin-x86_64-unknown-linux-gnu/atuin"
      linux-aarch64:
        asset: "{release}/atuin-aarch64-unknown-linux-gnu.tar.gz"
        member: "atuin-aarch64-unknown-linux-gnu/atuin"

  # Flat on Windows, nested on Unix. The archives also hold optional `nu_plugin_*` binaries, and
  # on Windows a `less.exe`, which `nu` runs without.
  nushell:
    description: "Cross-platform shell that treats command output as structured data"
    aliases: [nu]
    repository: https://github.com/nushell/nushell
    targets:
      windows-x86_64:
        asset: "{release}/nu-{version}-x86_64-pc-windows-msvc.zip"
        member: "nu.exe"
      windows-aarch64:
        asset: "{release}/nu-{version}-aarch64-pc-windows-msvc.zip"
        member: "nu.exe"
      macos-x86_64:
        asset: "{release}/nu-{version}-x86_64-apple-darwin.tar.gz"
        member: "nu-{version}-x86_64-apple-darwin/nu"
      macos-aarch64:
        asset: "{release}/nu-{version}-aarch64-apple-darwin.tar.gz"
        member: "nu-{version}-aarch64-apple-darwin/nu"
      linux-x86_64:
        asset: "{release}/nu-{version}-x86_64-unknown-linux-gnu.tar.gz"
        member: "nu-{version}-x86_64-unknown-linux-gnu/nu"
      linux-aarch64:
        asset: "{release}/nu-{version}-aarch64-unknown-linux-gnu.tar.gz"
        member: "nu-{version}-aarch64-unknown-linux-gnu/nu"

  # GitHub CLI ships a zip on macOS too, and nests the binary under `bin/` - inside a versioned
  # directory everywhere but Windows.
  gh:
    description: "GitHub's official CLI for pull requests, issues, releases and repos"
    aliases: [gh-cli, github-cli]
    repository: https://github.com/cli/cli
    targets:
      windows-x86_64:
        asset: "{release}/gh_{version}_windows_amd64.zip"
        member: "bin/gh.exe"
      windows-aarch64:
        asset: "{release}/gh_{version}_windows_arm64.zip"
        member: "bin/gh.exe"
      macos-x86_64:
        asset: "{release}/gh_{version}_macOS_amd64.zip"
        member: "gh_{version}_macOS_amd64/bin/gh"
      macos-aarch64:
        asset: "{release}/gh_{version}_macOS_arm64.zip"
        member: "gh_{version}_macOS_arm64/bin/gh"
      linux-x86_64:
        asset: "{release}/gh_{version}_linux_amd64.tar.gz"
        member: "gh_{version}_linux_amd64/bin/gh"
      linux-aarch64:
        asset: "{release}/gh_{version}_linux_arm64.tar.gz"
        member: "gh_{version}_linux_arm64/bin/gh"

  # gdu archives hold a single binary named after the platform, so `as` gives it the real name.
  gdu:
    description: "Fast disk usage analyzer with a terminal UI"
    repository: https://github.com/dundee/gdu
    targets:
      windows-x86_64:
        asset: "{release}/gdu_windows_amd64.exe.zip"
        member: "gdu_windows_amd64.exe"
        as: "gdu.exe"
      windows-aarch64:
        asset: "{release}/gdu_windows_arm64.exe.zip"
        member: "gdu_windows_arm64.exe"
        as: "gdu.exe"
      macos-x86_64:
        asset: "{release}/gdu_darwin_amd64.tgz"
        member: "gdu_darwin_amd64"
        as: "gdu"
      macos-aarch64:
        asset: "{release}/gdu_darwin_arm64.tgz"
        member: "gdu_darwin_arm64"
        as: "gdu"
      linux-x86_64:
        asset: "{release}/gdu_linux_amd64.tgz"
        member: "gdu_linux_amd64"
        as: "gdu"
      linux-aarch64:
        asset: "{release}/gdu_linux_arm64.tgz"
        member: "gdu_linux_arm64"
        as: "gdu"

  # Bare binaries: no `member`, so the asset is saved as it stands. `as` gives it the name you
  # would actually type.
  shfmt:
    description: "Shell script formatter for bash, POSIX sh and mksh"
    repository: https://github.com/mvdan/sh
    asset: "{release}/shfmt_v{version}_{target}{exe}"
    as: "shfmt{exe}"
    targets:
      windows-x86_64: windows_amd64
      macos-x86_64: darwin_amd64
      macos-aarch64: darwin_arm64
      linux-x86_64: linux_amd64
      linux-aarch64: linux_arm64

  yt-dlp:
    description: "Download video and audio from YouTube and many other sites"
    repository: https://github.com/yt-dlp/yt-dlp
    targets:
      windows-x86_64:
        asset: "{release}/yt-dlp.exe"
      windows-aarch64:
        asset: "{release}/yt-dlp_arm64.exe"
        as: "yt-dlp.exe"
      macos-x86_64:
        asset: "{release}/yt-dlp_macos"
        as: "yt-dlp"
      macos-aarch64:
        asset: "{release}/yt-dlp_macos"
        as: "yt-dlp"
      linux-x86_64:
        asset: "{release}/yt-dlp_linux"
        as: "yt-dlp"
      linux-aarch64:
        asset: "{release}/yt-dlp_linux_aarch64"
        as: "yt-dlp"

  ttt:
    description: "Terminal text editor that feels like a GUI one, such as VS Code"
    repository: https://github.com/eugenioenko/ttt
    targets:
      windows-x86_64:
        asset: "{release}/ttt-windows-amd64.exe"
        as: "ttt.exe"
      macos-x86_64:
        asset: "{release}/ttt-darwin-amd64"
        as: "ttt"
      macos-aarch64:
        asset: "{release}/ttt-darwin-arm64"
        as: "ttt"
      linux-x86_64:
        asset: "{release}/ttt-linux-amd64"
        as: "ttt"
      linux-aarch64:
        asset: "{release}/ttt-linux-arm64"
        as: "ttt"

  # jq tags releases `jq-1.8.2`. Asset names carry no version, so the tag shape never matters.
  jq:
    description: "Command-line JSON processor for querying, filtering and transforming"
    repository: https://github.com/jqlang/jq
    asset: "{release}/jq-{target}{exe}"
    as: "jq{exe}"
    targets:
      windows-x86_64: windows-amd64
      windows-aarch64: windows-arm64
      macos-x86_64: macos-amd64
      macos-aarch64: macos-arm64
      linux-x86_64: linux-amd64
      linux-aarch64: linux-arm64

  # yq also ships archives, but each holds only the same bare binary.
  yq:
    description: "Command-line YAML, JSON, XML, CSV and TOML processor, like jq"
    repository: https://github.com/mikefarah/yq
    asset: "{release}/yq_{target}{exe}"
    as: "yq{exe}"
    targets:
      windows-x86_64: windows_amd64
      windows-aarch64: windows_arm64
      macos-x86_64: darwin_amd64
      macos-aarch64: darwin_arm64
      linux-x86_64: linux_amd64
      linux-aarch64: linux_arm64


  # Bare binaries everywhere but Windows, where the release is a zip and `herdr.exe` loads the
  # `conpty/` directory shipped beside it - so that target lists every file it needs rather than
  # one. The two `OpenConsole.exe` builds share a basename, which only the list form can keep
  # apart. THIRD-PARTY-NOTICES/ is left out: licence text, not something the program reads.
  herdr:
    description: "Terminal runtime for running and managing AI coding agents"
    repository: https://github.com/herdrdev/herdr
    targets:
      windows-x86_64:
        asset: "{release}/herdr-windows-x86_64.zip"
        member:
          - herdr.exe
          - conpty/conpty.dll
          - conpty/herdr-conpty.json
          - conpty/x64/OpenConsole.exe
          - conpty/arm64/OpenConsole.exe
      macos-x86_64:
        asset: "{release}/herdr-macos-x86_64"
        as: herdr
      macos-aarch64:
        asset: "{release}/herdr-macos-aarch64"
        as: herdr
      linux-x86_64:
        asset: "{release}/herdr-linux-x86_64"
        as: herdr
      linux-aarch64:
        asset: "{release}/herdr-linux-aarch64"
        as: herdr

  # Windows only. The zip holds `psmux.exe`, `pmux.exe` and `tmux.exe`, three copies of one
  # binary, so only `tmux.exe` is taken. Upstream tmux ships source alone, hence the alias.
  psmux:
    description: "Native tmux for Windows, a terminal multiplexer for PowerShell and cmd"
    aliases: [tmux, pmux]
    repository: https://github.com/psmux/psmux
    asset: "{release}/psmux-v{version}-windows-{target}.zip"
    member: "tmux.exe"
    targets:
      windows-x86_64: x64
      windows-aarch64: arm64

  # Windows only by nature: it forwards notifications from WSL to the Windows host.
  wsl-notify-send:
    description: "Sends Windows desktop notifications from inside WSL, like notify-send"
    repository: https://github.com/stuartleeks/wsl-notify-send
    targets:
      windows-x86_64:
        asset: "{release}/wsl-notify-send_windows_amd64.zip"
        member: "wsl-notify-send.exe"

  # File Pilot ships only from its own website. fpilot-scraper mirrors each beta build as a GitHub
  # release, an x64 Windows binary under tags like `Beta-v0.8.5`.
  file-pilot:
    description: "Fast, lightweight file manager and Explorer replacement for Windows"
    aliases: [fpilot, filepilot]
    repository: https://github.com/Araxeus/fpilot-scraper
    targets:
      windows-x86_64:
        asset: "{release}/FPilot.exe"

  # Flat on Windows, nested on Unix, and the Unix builds are `.tar.xz` - so every host is
  # spelled out.
  fresh:
    description: "Fast, easy terminal text editor and IDE"
    repository: https://github.com/sinelaw/fresh
    targets:
      windows-x86_64:
        asset: "{release}/fresh-editor-x86_64-pc-windows-msvc.zip"
        member: "fresh.exe"
      windows-aarch64:
        asset: "{release}/fresh-editor-aarch64-pc-windows-msvc.zip"
        member: "fresh.exe"
      macos-x86_64:
        asset: "{release}/fresh-editor-x86_64-apple-darwin.tar.xz"
        member: "fresh-editor-x86_64-apple-darwin/fresh"
      macos-aarch64:
        asset: "{release}/fresh-editor-aarch64-apple-darwin.tar.xz"
        member: "fresh-editor-aarch64-apple-darwin/fresh"
      linux-x86_64:
        asset: "{release}/fresh-editor-x86_64-unknown-linux-gnu.tar.xz"
        member: "fresh-editor-x86_64-unknown-linux-gnu/fresh"
      linux-aarch64:
        asset: "{release}/fresh-editor-aarch64-unknown-linux-gnu.tar.xz"
        member: "fresh-editor-aarch64-unknown-linux-gnu/fresh"

  flow:
    description: "Flow Control, a programmer's text editor for the terminal"
    repository: https://github.com/neurocyte/flow
    # Its assets are named by the host key itself.
    asset: "{release}/flow-v{version}-{target}{ext}"
    member: "flow{exe}"
    targets:
      windows-x86_64: windows-x86_64
      windows-aarch64: windows-aarch64
      macos-x86_64: macos-x86_64
      macos-aarch64: macos-aarch64
      linux-x86_64: linux-x86_64
      linux-aarch64: linux-aarch64

  # The SDK monorepo tags `bws-v2.1.0` alongside `rust-v2.1.0` and `python-v2.1.0`, and only the
  # first has the binaries. Without `releaseRegex` the newest release has no assets at all.
  bitwarden-secrets-cli:
    description: "Bitwarden Secrets Manager CLI for fetching secrets in scripts and CI"
    aliases: [bws]
    repository: https://github.com/bitwarden/sdk
    releaseRegex: '^bws-v\d+\.\d+\.\d+$'
    asset: "{release}/bws-{target}-{version}.zip"
    member: "bws{exe}"
    targets:
      windows-x86_64: x86_64-pc-windows-msvc
      windows-aarch64: aarch64-pc-windows-msvc
      macos-x86_64: x86_64-apple-darwin
      macos-aarch64: aarch64-apple-darwin
      linux-x86_64: x86_64-unknown-linux-gnu
      linux-aarch64: aarch64-unknown-linux-gnu

  # Flat on Windows, nested under `usr/bin` elsewhere, so every host is spelled out. Windows also
  # ships `lua55.dll`, which fastfetch loads only for Lua-scripted configs.
  fastfetch:
    description: "Neofetch-like tool that shows system information in the terminal"
    repository: https://github.com/fastfetch-cli/fastfetch
    targets:
      windows-x86_64:
        asset: "{release}/fastfetch-windows-amd64.zip"
        member: "fastfetch.exe"
      windows-aarch64:
        asset: "{release}/fastfetch-windows-aarch64.zip"
        member: "fastfetch.exe"
      macos-x86_64:
        asset: "{release}/fastfetch-macos-universal.tar.gz"
        member: "fastfetch-macos-universal/usr/bin/fastfetch"
      macos-aarch64:
        asset: "{release}/fastfetch-macos-universal.tar.gz"
        member: "fastfetch-macos-universal/usr/bin/fastfetch"
      linux-x86_64:
        asset: "{release}/fastfetch-linux-amd64.tar.gz"
        member: "fastfetch-linux-amd64/usr/bin/fastfetch"
      linux-aarch64:
        asset: "{release}/fastfetch-linux-aarch64.tar.gz"
        member: "fastfetch-linux-aarch64/usr/bin/fastfetch"

  # `.zip` on Windows but `.tar.xz` on Linux, and no macOS or Windows arm64 builds.
  upx:
    description: "Executable packer that compresses binaries to shrink their size"
    repository: https://github.com/upx/upx
    targets:
      windows-x86_64:
        asset: "{release}/upx-{version}-win64.zip"
        member: "upx-{version}-win64/upx.exe"
      linux-x86_64:
        asset: "{release}/upx-{version}-amd64_linux.tar.xz"
        member: "upx-{version}-amd64_linux/upx"
      linux-aarch64:
        asset: "{release}/upx-{version}-arm64_linux.tar.xz"
        member: "upx-{version}-arm64_linux/upx"

  hide-console:
    description: "Run a command on Windows with its console window hidden"
    aliases: [hide]
    repository: https://github.com/Araxeus/hide-console
    targets:
      windows-x86_64:
        asset: "{release}/hide.exe"

  # The CLI lives in `carapace-bin`; `carapace-sh/carapace` is the Go library behind it.
  carapace:
    description: "Shell completion for hundreds of commands in bash, zsh, fish and more"
    aliases: [carapace-bin]
    repository: https://github.com/carapace-sh/carapace-bin
    asset: "{release}/carapace-bin_{version}_{target}{ext}"
    member: "carapace{exe}"
    targets:
      windows-x86_64: windows_amd64
      windows-aarch64: windows_arm64
      macos-x86_64: darwin_amd64
      macos-aarch64: darwin_arm64
      linux-x86_64: linux_amd64
      linux-aarch64: linux_arm64
